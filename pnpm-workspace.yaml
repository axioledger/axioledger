packages:
  # ─── Apps (user-facing frontends & wallets) ────────────────────────────────
  - "apps/*"

  # ─── Shared packages (libraries, SDKs, design system) ─────────────────────
  - "packages/*"

  # ─── Core nodes (validator, sequencer — non-JS stubs / FFI bindings) ───────
  - "core-nodes/*"

  # ─── Smart contracts (Solidity / Forge workspaces) ─────────────────────────
  - "smart-contracts/*"
