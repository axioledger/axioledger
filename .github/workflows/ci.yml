# .github/workflows/ci.yml
# AXIOLEDGER Monorepo CI
#
# Triggers: push to main, pull_request to main
#
# Required Secrets:
#   NODE_AUTH_TOKEN — PAT with read:packages for @veraciphers npm registry
#   AXIO_REGISTRY_PAT — PAT with packages:write for publishing (publish job only)

name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9"

jobs:
  # ─── Security Gate ──────────────────────────────────────────────────────────
  security-scan:
    name: "🔐 Security Gate (TruffleHog)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ─── Lint & Typecheck ───────────────────────────────────────────────────────
  lint-typecheck:
    name: "🔍 Lint & Typecheck"
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          registry-url: "https://npm.pkg.github.com"
          scope: "@veraciphers"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: "🔍 Lint"
        run: pnpm lint || true

      - name: "🔡 Typecheck"
        run: pnpm typecheck

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          registry-url: "https://npm.pkg.github.com"
          scope: "@veraciphers"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: "🧪 Run tests"
        run: pnpm test

      - name: "📤 Upload coverage"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: "**/coverage/"
          retention-days: 7

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          registry-url: "https://npm.pkg.github.com"
          scope: "@veraciphers"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: "🏗️ Turbo build"
        run: pnpm build
        env:
          TURBO_TELEMETRY_DISABLED: "1"

  # ─── Supply Chain Audit ─────────────────────────────────────────────────────
  supply-chain-audit:
    name: "🛡️ Supply Chain Audit"
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"

      - name: "📦 Install (no scripts — supply chain safety)"
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || 'dummy' }}

      - name: "🔎 npm audit"
        run: pnpm audit --audit-level=high || true
