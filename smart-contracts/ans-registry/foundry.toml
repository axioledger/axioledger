[profile.default]
src          = "src"
test         = "test"
script       = "script"
out          = "out"
libs         = ["lib"]
solc         = "0.8.28"
optimizer    = true
optimizer_runs = 200
via_ir       = true
remappings   = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

fs_permissions = [
  { access = "read",  path = "./script" },
  { access = "write", path = "./script" }
]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 3
