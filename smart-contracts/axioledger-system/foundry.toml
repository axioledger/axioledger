[profile.default]
src          = "src"
test         = "test"
out          = "out"
libs         = ["lib"]
solc         = "0.8.28"
optimizer    = true
optimizer_runs = 200
via_ir       = true
remappings   = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Allow Deploy.s.sol to write addresses.json and .env.localnet / .env.sepolia
fs_permissions = [
  { access = "read-write", path = "script/" },
  { access = "write",      path = ".env.localnet" },
  { access = "write",      path = ".env.sepolia" }
]
